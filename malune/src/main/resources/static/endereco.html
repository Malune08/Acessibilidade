<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malune - Endereço</title>
    <link rel="stylesheet" href="css/endereco.css">
    <link rel="stylesheet" href="css/global-fluxo-pagamento.css">
    <link rel="stylesheet" href="css/modal-acessibilidade.css">
    <link rel="icon" type="image/png" href="images/icone.png">
</head>
<body>

    <header class="header-topo">
        <div class="header-esq">
            <a href="#" class="logo-link">
                <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-topo">
            </a>
        </div>
       
        <div class="header-centro">
            <h2>Endereço</h2>
        </div>
       
        <div class="header-dir">
            <button id="btn-abrir-a11y" class="btn-a11y" type="button" aria-label="Abrir menu de acessibilidade" aria-controls="modal-a11y" aria-expanded="false">
                <img src="images/iconacessibilidade.png" alt="Acessibilidade" class="img-a11y">
            </button>
        </div>
    </header>

    <div class="decor circle-yellow"></div>
    <div class="decor circle-blue-top"></div>
    <div class="decor circle-blue-bottom"></div>
    <div class="decor circle-green"></div>

    <main class="main-container">
        <div class="progress-container">

            <div class="progress-step">
                <div class="progress-circle active">1</div>
                <span class="progress-label">Endereço</span>
            </div>

            <div class="progress-line"></div>
            
            <div class="progress-step">
                <div class="progress-circle">2</div>
                <span class="progress-label">Pagamento</span>
            </div>

            <div class="progress-line"></div>

            <div class="progress-step">
                <div class="progress-circle">3</div>
                <span class="progress-label">Revisar</span>
            </div>
        </div>

        <section class="endereco-card" aria-label="Confirmação do endereço">
            <img src="images/logomalune.png" alt="Logo Malune" class="logo-endereco">

            <h1>Confirme o seu endereço</h1>

            <p class="descricao-endereco"> Confirme seu endereço correto para<br> não termos problemas com a entrega</p>

            <form id="form-endereco" aria-describedby="mensagem-endereco">
                <div class="endereco-form-grid">
                    <div class="endereco-campo">
                        <label for="cep">Cep</label>
                        <input type="text" id="cep" name="cep" placeholder="04747-140" maxlength="9" required>
                    </div>

                    <div class="endereco-campo">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="Acre">Acre</option>
                            <option value="Alagoas">Alagoas</option>
                            <option value="Amapá">Amapá</option>
                            <option value="Amazonas">Amazonas</option>
                            <option value="Bahia">Bahia</option>
                            <option value="Ceará">Ceará</option>
                            <option value="Distrito Federal">Distrito Federal</option>
                            <option value="Espírito Santo">Espírito Santo</option>
                            <option value="Goiás">Goiás</option>
                            <option value="Maranhão">Maranhão</option>
                            <option value="Mato Grosso">Mato Grosso</option>
                            <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                            <option value="Minas Gerais">Minas Gerais</option>
                            <option value="Pará">Pará</option>
                            <option value="Paraíba">Paraíba</option>
                            <option value="Paraná">Paraná</option>
                            <option value="Pernambuco">Pernambuco</option>
                            <option value="Piauí">Piauí</option>
                            <option value="Rio de Janeiro">Rio de Janeiro</option>
                            <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                            <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                            <option value="Rondônia">Rondônia</option>
                            <option value="Roraima">Roraima</option>
                            <option value="Santa Catarina">Santa Catarina</option>
                            <option value="São Paulo">São Paulo</option>
                            <option value="Sergipe">Sergipe</option>
                            <option value="Tocantins">Tocantins</option>
                        </select>
                    </div>

                    <div class="endereco-campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" placeholder="Rua Belterra" maxlength="150" required>
                    </div>

                    <div class="endereco-campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Santo Amaro" maxlength="70" required>
                    </div>

                    <div class="endereco-campo">
                        <label for="numero">Número</label>
                        <input type="number" id="numero" name="numero" placeholder="291" maxlength="6" required>
                    </div>

                    <div class="endereco-campo">
                        <label for="complemento">Complemento (opcional)</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Casa de 50k" maxlength="50">
                    </div>
                </div>

                <p id="mensagem-endereco" class="mensagem-endereco" role="alert" aria-live="assertive"></p>

                <button type="submit" class="btn-prosseguir">
                    Continuar
                </button>
            </form>
        </section>
    </main>

    <script src="js/modal-acessibilidade.js"></script>
    <script src="js/endereco.js"></script>
</body>
</html>
