<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malune - Endereço</title>

    <link rel="stylesheet" href="css/cadastro-endereco.css">
    <link rel="stylesheet" href="css/modal-acessibilidade.css">
    <link rel="icon" type="image/png" href="images/icone.png">
</head>

<body>

<header class="header-topo">
    <div class="header-esq">
        <a href="index.html" class="logo-link">
            <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-topo">
        </a>
    </div>

    <div class="header-centro">
        <h2>Criar conta</h2>
    </div>

    <div class="header-dir">
        <button id="btn-abrir-a11y" class="btn-a11y" aria-label="Abrir menu de acessibilidade">
            <img src="images/iconacessibilidade.png" alt="Acessibilidade" class="img-a11y">
        </button>
    </div>
</header>

<div class="decor circle-yellow"></div>
<div class="decor circle-blue-top"></div>
<div class="decor circle-green"></div>

<main class="main-container">
    <section class="card-cadastro">
        <div class="card-header">
            <a href="index.html" class="logo-link-card">
                <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-card">
            </a>
            <p>Criar sua conta</p>
            <span class="subtitle">Vamos brincar juntos</span>
        </div>

        <form id="form-endereco">
            <div class="input-row">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="04747-140" required>
                </div>

                <div class="input-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Acre">Acre</option>
                        <option value="Alagoas">Alagoas</option>
                        <option value="Amapá">Amapá</option>
                        <option value="Amazonas">Amazonas</option>
                        <option value="Bahia">Bahia</option>
                        <option value="Ceará">Ceará</option>
                        <option value="Distrito Federal">Distrito Federal</option>
                        <option value="Espírito Santo">Espírito Santo</option>
                        <option value="Goiás">Goiás</option>
                        <option value="Maranhão">Maranhão</option>
                        <option value="Mato Grosso">Mato Grosso</option>
                        <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                        <option value="Minas Gerais">Minas Gerais</option>
                        <option value="Pará">Pará</option>
                        <option value="Paraíba">Paraíba</option>
                        <option value="Paraná">Paraná</option>
                        <option value="Pernambuco">Pernambuco</option>
                        <option value="Piauí">Piauí</option>
                        <option value="Rio de Janeiro">Rio de Janeiro</option>
                        <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                        <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                        <option value="Rondônia">Rondônia</option>
                        <option value="Roraima">Roraima</option>
                        <option value="Santa Catarina">Santa Catarina</option>
                        <option value="São Paulo">São Paulo</option>
                        <option value="Sergipe">Sergipe</option>
                        <option value="Tocantins">Tocantins</option>
                    </select>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" placeholder="Rua Belterra" required>
                </div>

                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Santo Amaro" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="number" id="numero" name="numero" placeholder="291" required>
                </div>

                <div class="input-group">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Casa de 50k">
                </div>
            </div>

            <div class="botoes-acao">
                <button type="button" id="btn-cadastrar-depois" class="btn-depois">
                    Cadastrar depois
                </button>
                <button type="submit" class="btn-continuar-etapa2">
                    Criar conta
                </button>
            </div>
        </form>
    </section>
</main>

<script src="js/modal-acessibilidade.js"></script>
<script src="js/cadastro-endereco.js"></script>
</body>
</html>
