<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malune - Compra Confirmada</title>
    <link rel="stylesheet" href="css/compra-confirmada.css">
    <link rel="stylesheet" href="css/global-fluxo-pagamento.css">
    <link rel="stylesheet" href="css/modal-acessibilidade.css">
    <link rel="icon" type="image/png" href="images/icone.png">
</head>
<body>

    <header class="header-topo">
        <div class="header-esq">
            <a href="#" class="logo-link">
                <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-topo">
            </a>
        </div>
       
        <div class="header-centro">
            <nav class="nav-header">
                <a href="#" class="nav-link">Produtos</a>
                <a href="#" class="nav-link">Meus Pedidos</a>
            </nav>
        </div>
       
        <div class="header-dir">
            <button id="btn-abrir-a11y" class="btn-a11y" aria-label="Abrir menu de acessibilidade">
                <img src="images/iconacessibilidade.png" alt="Acessibilidade" class="img-a11y">
            </button>
            <a href="#" class="btn-header-icon">
                <img src="images/icone-carrinho.png" alt="Carrinho">
            </a>
            <a href="#" class="btn-header-icon">
                <img src="images/icone-configuracoes.png" alt="Configurações">
            </a>
            <a href="#" class="btn-header-icon">
                <img src="images/icone-sair.png" alt="Sair">
            </a>
        </div>
    </header>

    <div class="decor circle-yellow"></div>
    <div class="decor circle-blue-top"></div>
    <div class="decor circle-blue-bottom"></div>
    <div class="decor circle-green"></div>

    <main class="main-container">
        <div class="status-badge">
            <img src="images/check-confirmado.png" alt="Confirmado" class="status-check">
            <span class="status-texto">Pedido confirmado</span>
        </div>

        <section class="card-confirmacao">
            <h2 class="titulo-confirmacao">Compra confirmada!</h2>
            <p class="subtitulo-confirmacao">Seu pedido foi recebido e está sendo preparado com muito carinho.</p>

            <div class="botoes-confirmacao">
                <button class="btn-ver-pedido">Ver pedido</button>
                <button class="btn-continuar-comprando">Continuar comprando</button>
            </div>
        </section>
    </main>

    <script src="js/modal-acessibilidade.js"></script>
    <script src="js/compra-confirmada.js"></script>
</body>
</html>
