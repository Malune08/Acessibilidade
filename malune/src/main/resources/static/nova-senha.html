<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malune - Nova senha</title>
    <link rel="stylesheet" href="css/nova-senha.css">
    <link rel="stylesheet" href="css/modal-acessibilidade.css">
    <link rel="icon" type="image/png" href="images/icone.png">
</head>
<body>

<header class="header-topo">
    <div class="header-esq">
        <a href="index.html" class="logo-link">
            <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-topo">
        </a>
    </div>

    <div class="header-centro">
        <h2>Nova senha</h2>
    </div>

    <div class="header-dir">
        <button id="btn-abrir-a11y" class="btn-a11y" type="button" aria-label="Abrir menu de acessibilidade" aria-controls="modal-a11y" aria-expanded="false">
            <img src="images/iconacessibilidade.png" alt="Acessibilidade" class="img-a11y">
        </button>
    </div>
</header>

<div class="decor circle-yellow"></div>
<div class="decor circle-blue-top"></div>
<div class="decor circle-blue-bottom"></div>
<div class="decor circle-green"></div>

<main class="main-container">
    <section class="card-cadastro">
        <div class="card-header">
            <a href="index.html" class="logo-link-card">
                <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-card">
            </a>

            <p>Atualize a senha</p>
            <span class="subtitle">Coloque a sua nova senha</span>
        </div>

        <form id="formNovaSenha" action="#" method="POST">
            <div class="input-group">
                <label for="novaSenha">Senha nova</label>

                <div class="campo-senha">
                    <input
                            type="password"
                            id="novaSenha"
                            name="novaSenha"
                            placeholder="Insira a sua senha"
                            required
                    >
                    <button id="mostrar-nova-senha" class="botao-olho" type="button" aria-label="Mostrar nova senha" aria-pressed="false">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmarSenha">
                    Confirmar a senha
                </label>

                <div class="campo-senha">
                    <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Insira a sua senha"
                            required
                    >
                    <button id="mostrar-confirmar-senha" class="botao-olho" type="button" aria-label="Mostrar confirmação de senha" aria-pressed="false">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-continuar">
                Atualizar a senha
            </button>
        </form>
    </section>
</main>

<script src="js/modal-acessibilidade.js"></script>
<script src="js/nova-senha.js"></script>
</body>
</html>
