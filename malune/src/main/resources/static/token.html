<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malune - Token</title>
    <link rel="stylesheet" href="css/token.css">
    <link rel="stylesheet" href="css/modal-acessibilidade.css">
    <link rel="icon" type="image/png" href="images/icone.png">
</head>
<body>

<header class="header-topo">
    <div class="header-esq">
        <a href="index.html" class="logo-link">
            <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-topo">
        </a>
    </div>

    <div class="header-centro">
        <h2>Token</h2>
    </div>

    <div class="header-dir">
        <button id="btn-abrir-a11y" class="btn-a11y" aria-label="Abrir menu de acessibilidade">
            <img src="images/iconacessibilidade.png" alt="Acessibilidade" class="img-a11y">
        </button>
    </div>
</header>

<div class="decor circle-yellow"></div>
<div class="decor circle-blue-top"></div>
<div class="decor circle-blue-bottom"></div>
<div class="decor circle-green"></div>

<main class="main-container">
    <section class="card-cadastro">
        <div class="card-header">
            <a href="index.html" class="logo-link-card">
                <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-card">
            </a>

            <p>Token</p>

            <span class="subtitle">
                    Informe o token enviado ao seu e-mail<br>
                    para mudar a senha
                </span>
        </div>

        <form id="formCodigo" action="#" method="POST">
            <div class="input-group">
                <label for="token">Token</label>

                <input
                        type="text"
                        id="token"
                        name="token"
                        placeholder="111111"
                        maxlength="6"
                        required
                >
            </div>

            <button type="submit" class="btn-continuar">
                Prosseguir
            </button>
        </form>
    </section>
</main>

<script src="js/modal-acessibilidade.js"></script>
<script src="js/token.js"></script>
</body>
</html>
