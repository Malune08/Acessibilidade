<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malune - Entrar na conta</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="images/icone.png">
</head>
<body>
    <header class="header-topo">
        <div class="header-esq">
            <a href="index.html" class="logo-link">
                <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-topo">
            </a>
        </div>

        <div class="header-centro">
            <h2>Entrar na conta</h2>
        </div>

        <div class="header-dir">
            <button id="btn-abrir-a11y" class="btn-a11y" aria-label="Abrir menu de acessibilidade">
                <img src="images/iconacessibilidade.png" alt="Acessibilidade" class="img-a11y">
            </button>
        </div>
    </header>

    <div class="decor circle-yellow"></div>
    <div class="decor circle-blue-top"></div>
    <div class="decor circle-blue-bottom"></div>
    <div class="decor circle-green"></div>

    <main class="main-container">
        <section class="card-cadastro">
            <div class="card-header">
                <a href="index.html" class="logo-link-card">
                    <img src="images/logomalune.png" alt="Logo Malune" class="img-logo-card">
                </a>

                <p>Entrar na sua conta</p>
                <span class="subtitle">Bem-vindo de volta</span>
            </div>

            <form id="form-login" action="/login" method="POST">
                <button type="button" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 18 18">
                        <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.26h2.94c1.72-1.58 2.72-3.9 2.72-6.62z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.85.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/>
                        <path fill="#FBBC05" d="M3.97 10.75c-.19-.54-.3-1.12-.3-1.75s.11-1.21.3-1.75V4.92H.95C.34 6.14 0 7.52 0 9s.34 2.86.95 4.08l3.02-2.33z"/>
                        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.92l3.02 2.33c.71-2.13 2.69-3.67 5.03-3.67z"/>
                    </svg>

                    Continuar com o Google
                </button>

                <div class="divisor">
                    <span>ou</span>
                </div>

                <div class="input-group">
                    <label for="identificador">E-mail ou usuário</label>

                    <input
                        type="text"
                        id="identificador"
                        name="identificador"
                        autocomplete="username"
                        placeholder="E-mail ou nome de usuário"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="Insira sua senha"
                            required
                    >
                </div>

                <div class="forgot-password">
                    Esqueceu a senha?
                    <a href="esqueci-senha.html">Clique aqui</a>
                </div>

                <p id="login-error" class="login-error" role="alert" hidden></p>

                <button type="submit" class="btn-continuar">
                    Continuar
                </button>
            </form>
        </section>
    </main>

    <dialog id="modal-a11y" aria-labelledby="modal-a11y-title">
        <div class="modal-header">
            <h3 id="modal-a11y-title">Acessibilidade</h3>

            <button
                id="btn-fechar-a11y"
                aria-label="Fechar menu de acessibilidade"
            >
                X
            </button>
        </div>

        <div class="modal-body">
            <div class="a11y-item">
                <div class="a11y-info">
                    <strong>Alto contraste</strong>
                    <span>Cores fortes para melhor leitura</span>
                </div>

                <label class="switch">
                    <input type="checkbox" id="toggle-contraste">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="a11y-item">
                <div class="a11y-info">
                    <strong>Texto grande</strong>
                    <span>Aumenta o tamanho da fonte</span>
                </div>

                <label class="switch">
                    <input type="checkbox" id="toggle-texto">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="a11y-item">
                <div class="a11y-info">
                    <strong>Fonte para dislexia</strong>
                    <span>Mais fácil de ler</span>
                </div>

                <label class="switch">
                    <input type="checkbox" id="toggle-dislexia">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="a11y-item">
                <div class="a11y-info">
                    <strong>Sublinhar links</strong>
                    <span>Destaca todos os links</span>
                </div>

                <label class="switch">
                    <input type="checkbox" id="toggle-links">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="modal-footer">
            <button id="btn-restaurar" class="btn-restaurar">
                Restaurar padrão
            </button>
        </div>
    </dialog>

    <script src="js/login.js"></script>
</body>
</html>
